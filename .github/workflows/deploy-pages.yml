name: Build and deploy label and store
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install label dependencies
        run: npm install --prefix rhythmroots_records_github
      - name: Install store dependencies
        run: npm ci --prefix store
      - name: Check and build label
        run: npm run build --prefix rhythmroots_records_github
      - name: Test store
        run: npm test --prefix store
      - name: Check and build store
        run: npm run build --prefix store
        env:
          VITE_SITE_URL: https://jonfolsetech-ctrl.github.io/RythnmRootsRecords_Suburban-Kid/store/
          VITE_ENABLE_INDEXING: 'true'
      - name: Assemble one website
        run: node scripts/assemble.mjs
      - name: Verify rendered SEO pages
        run: node scripts/check-seo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
