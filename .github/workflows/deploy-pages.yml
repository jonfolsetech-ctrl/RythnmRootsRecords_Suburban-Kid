name: Build and deploy RhythmRoots Records
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "rhythmroots_records_github/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhythmroots_records_github
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rhythmroots_records_github/package.json
      - name: Install dependencies
        run: npm install
      - name: Build React and Tailwind site
        run: npm run build
      - name: Keep legacy nested URL working
        run: |
          mkdir -p dist/rhythmroots_records_github
          cp dist/index.html dist/rhythmroots_records_github/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: rhythmroots_records_github/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
